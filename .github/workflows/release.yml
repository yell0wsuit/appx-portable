name: Publish DLL release

on:
    push:
        branches: [main]
        paths:
            - 'shim/**'
            - 'proxy/**'
            - 'cmake/**'
            - 'tests/**'
            - 'scripts/**'
            - 'installappx.py'
            - 'patch/**'
            - 'CMakeLists.txt'
            - 'CMakePresets.json'
            - '.github/workflows/release.yml'
            - '.github/actions/**'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: dll-release
    cancel-in-progress: false

jobs:
    release:
        if: github.ref == 'refs/heads/main'
        runs-on: windows-latest
        timeout-minutes: 30
        defaults:
            run:
                shell: pwsh
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}

        steps:
            - name: Determine release version
              id: version
              run: |
                  $date = [DateTime]::UtcNow
                  # SemVer numeric components cannot have leading zeroes.
                  $baseTag = "v$($date.Year).$($date.Month).$($date.Day)"
                  $tags = gh api --paginate "repos/$env:GH_REPO/releases" --jq '.[].tag_name'
                  if ($LASTEXITCODE -ne 0) { throw 'Failed to check existing releases.' }
                  # Include tags without releases so a failed publication cannot reuse an old tag.
                  $gitTags = gh api --paginate "repos/$env:GH_REPO/tags" --jq '.[].name'
                  if ($LASTEXITCODE -ne 0) { throw 'Failed to check existing tags.' }
                  $usedTags = @($tags) + @($gitTags)
                  $tag = $baseTag
                  $revision = 0
                  while ($tag -in $usedTags) {
                    $revision++
                    $tag = "$baseTag-$revision"
                  }
                  "tag=$tag" >> $env:GITHUB_OUTPUT
                  Write-Host "Publishing release $tag"

            - name: Check out source
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Build and test
              uses: ./.github/actions/build-test
              with:
                  version: ${{ steps.version.outputs.tag }}

            - name: Publish release
              env:
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
              run: |
                  $archives = @()
                  foreach ($architecture in @('x86', 'x64')) {
                    $build = "build/release-$architecture"
                    $assets = @(
                      "$build/RelWithDebInfo/appxportable.dll"
                      "$build/RelWithDebInfo/d3dcompiler_47.dll"
                      "$build/RelWithDebInfo/XAudio2_8.dll"
                      "$build/RelWithDebInfo/XAudio2_9.dll"
                      "$build/RelWithDebInfo/DWrite.dll"
                    )
                    # The x64 release supports native UWP games; CLR hosting is x86 only.
                    if ($architecture -eq 'x86') { $assets += "$build/appx-host.exe" }
                    $machine = if ($architecture -eq 'x86') { 0x014c } else { 0x8664 }
                    foreach ($asset in $assets) {
                      if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
                        throw "Missing release asset: $asset"
                      }
                      $bytes = [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $asset).Path)
                      $pe = [BitConverter]::ToInt32($bytes, 0x3c)
                      if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x00004550 -or
                          [BitConverter]::ToUInt16($bytes, $pe + 4) -ne $machine) {
                        throw "Release asset must be $architecture`: $asset"
                      }
                    }
                    $archive = "build/appx-portable-$env:RELEASE_TAG-$architecture.zip"
                    Compress-Archive -LiteralPath $assets -DestinationPath $archive -CompressionLevel Optimal -Force
                    $archives += $archive
                  }
                  # installappx.py is published beside the zips: players download only it.
                  gh release create $env:RELEASE_TAG @archives installappx.py --target $env:GITHUB_SHA --title $env:RELEASE_TAG --generate-notes --latest
                  if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release.' }
