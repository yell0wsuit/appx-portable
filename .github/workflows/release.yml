name: Publish DLL release

on:
    push:
        branches: [main]
        paths:
            - 'shim/**'
            - 'proxy/**'
            - 'cmake/**'
            - 'tests/**'
            - 'scripts/**'
            - 'patch/**'
            - 'wine/**'
            - 'CMakeLists.txt'
            - 'CMakePresets.json'
            - '.github/workflows/release.yml'
            - '.github/workflows/wine-clr.yml'
            - '.github/actions/**'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: dll-release
    cancel-in-progress: false

defaults:
    run:
        shell: pwsh

jobs:
    version:
        if: github.ref == 'refs/heads/main' && !github.event.repository.fork
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
        outputs:
            tag: ${{ steps.version.outputs.tag }}
            release: ${{ steps.check.outputs.release }}

        steps:
            - name: Check for releasable commits
              id: check
              env:
                  COMMITS: ${{ toJSON(github.event.commits) }}
              run: |
                  # Manual runs always release; pushes need a feat, fix, perf or refactor commit, or any breaking (!) one.
                  $release = $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch'
                  if (-not $release) {
                    $messages = @(($env:COMMITS | ConvertFrom-Json).message)
                    $release = [bool]($messages -match '^((feat|fix|perf|refactor)(\(.+\))?!?|\w+(\(.+\))?!):')
                  }
                  "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
                  if (-not $release) { Write-Host 'No releasable commits; skipping release.' }

            - name: Determine release version
              id: version
              if: steps.check.outputs.release == 'true'
              run: |
                  $date = [DateTime]::UtcNow
                  # SemVer numeric components cannot have leading zeroes.
                  $baseTag = "v$($date.Year).$($date.Month).$($date.Day)"
                  $tags = gh api --paginate "repos/$env:GH_REPO/releases" --jq '.[].tag_name'
                  if ($LASTEXITCODE -ne 0) { throw 'Failed to check existing releases.' }
                  # Include tags without releases so a failed publication cannot reuse an old tag.
                  $gitTags = gh api --paginate "repos/$env:GH_REPO/tags" --jq '.[].name'
                  if ($LASTEXITCODE -ne 0) { throw 'Failed to check existing tags.' }
                  $usedTags = @($tags) + @($gitTags)
                  $tag = $baseTag
                  $revision = 0
                  while ($tag -in $usedTags) {
                    $revision++
                    $tag = "$baseTag-$revision"
                  }
                  "tag=$tag" >> $env:GITHUB_OUTPUT
                  Write-Host "Publishing release $tag"

    build:
        name: build (${{ matrix.architecture }})
        needs: version
        if: needs.version.outputs.release == 'true'
        runs-on: windows-latest
        timeout-minutes: 30
        strategy:
            matrix:
                architecture: [x86, x64]

        steps:
            - name: Check out source
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Build and test
              uses: ./.github/actions/build-test
              with:
                  architecture: ${{ matrix.architecture }}
                  version: ${{ needs.version.outputs.tag }}

            - name: Package
              env:
                  ARCHITECTURE: ${{ matrix.architecture }}
                  RELEASE_TAG: ${{ needs.version.outputs.tag }}
              run: |
                  $build = "build/release-$env:ARCHITECTURE"
                  $assets = @(
                    "$build/appxportable.dll"
                    "$build/d3dcompiler_47.dll"
                    "$build/XAudio2_8.dll"
                    "$build/XAudio2_9.dll"
                    "$build/DWrite.dll"
                      "$build/appx-native-host.exe"
                  )
                  # The x64 release supports native UWP games; CLR hosting is x86 only.
                  if ($env:ARCHITECTURE -eq 'x86') { $assets += "$build/appx-host.exe" }
                  $machine = if ($env:ARCHITECTURE -eq 'x86') { 0x014c } else { 0x8664 }
                  foreach ($asset in $assets) {
                    if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
                      throw "Missing release asset: $asset"
                    }
                    $bytes = [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $asset).Path)
                    $pe = [BitConverter]::ToInt32($bytes, 0x3c)
                    if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x00004550 -or
                        [BitConverter]::ToUInt16($bytes, $pe + 4) -ne $machine) {
                      throw "Release asset must be $env:ARCHITECTURE`: $asset"
                    }
                  }
                  $assets += "$build/WebView2-LICENSE.txt"
                  Compress-Archive -LiteralPath $assets -DestinationPath "build/appx-portable-$env:RELEASE_TAG-$env:ARCHITECTURE.zip" -CompressionLevel Optimal -Force

            - name: Build prebuilt WinRT assemblies
              if: matrix.architecture == 'x86'
              env:
                  # SDK contract metadata is build input only; it never enters a release asset.
                  CONTRACTS_VERSION: 10.0.28000.2957
                  CONTRACTS_SHA512: ff32f4004a8c89747474fb3380e7f885ead3a525bd62844ddc1c77f70a5fe9ce3175d9d0ee0a211033a82ca5da3c18cb32ec3b3761286827daf243d2cfbf356e
                  CECIL_VERSION: 0.11.6
                  CECIL_SHA512: 1c5932246b23c9f317690a25ce3e1416d168d885871063d2f604cf997ed9e99d41bccdd0e22d4be6e4a5ea729d06bd92cc543686dbbd75ab0199db60e0912fb4
              run: |
                  $packages = @(
                    @{ Id = 'microsoft.windows.sdk.contracts'; Version = $env:CONTRACTS_VERSION; Sha512 = $env:CONTRACTS_SHA512 }
                    @{ Id = 'mono.cecil'; Version = $env:CECIL_VERSION; Sha512 = $env:CECIL_SHA512 }
                  )
                  New-Item -ItemType Directory -Force -Path build/nuget | Out-Null
                  foreach ($package in $packages) {
                    $name = "$($package.Id).$($package.Version)"
                    $archive = "build/nuget/$name.nupkg"
                    Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/$($package.Id)/$($package.Version)/$name.nupkg" -OutFile $archive
                    $digest = (Get-FileHash -Algorithm SHA512 -LiteralPath $archive).Hash.ToLowerInvariant()
                    if ($digest -ne $package.Sha512) { throw "NuGet package digest mismatch: $name" }
                    Expand-Archive -LiteralPath $archive -DestinationPath "build/nuget/$name" -Force
                  }
                  python scripts/build-winrt-release.py `
                    --metadata "build/nuget/microsoft.windows.sdk.contracts.$env:CONTRACTS_VERSION/ref/netstandard2.0" `
                    --cecil "build/nuget/mono.cecil.$env:CECIL_VERSION/lib/net40/Mono.Cecil.dll" `
                    --output build/winrt-release
                  if ($LASTEXITCODE -ne 0) { throw 'Prebuilt WinRT assembly build failed.' }

            - name: Package install-time projection tools
              if: matrix.architecture == 'x86'
              run: |
                  python scripts/package-winrt-tools.py --prebuilt build/winrt-release --output build/appx-portable-winrt-tools.zip
                  if ($LASTEXITCODE -ne 0) { throw 'Projection tools packaging failed.' }

            - name: Upload WinRT surface report
              if: matrix.architecture == 'x86'
              uses: actions/upload-artifact@v7
              with:
                  name: winrt-surface-report
                  path: build/winrt-release/surface-report.txt
                  if-no-files-found: error

            - name: Upload package
              uses: actions/upload-artifact@v7
              with:
                  name: release-${{ matrix.architecture }}
                  path: build/appx-portable-*.zip
                  if-no-files-found: error

    wine-graphics:
        needs: version
        if: needs.version.outputs.release == 'true'
        uses: ./.github/workflows/wine-graphics.yml

    wine-clr:
        needs: version
        if: needs.version.outputs.release == 'true'
        uses: ./.github/workflows/wine-clr.yml

    publish:
        needs: [version, build, wine-graphics, wine-clr]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}

        steps:
            - name: Check out source
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Download packages
              uses: actions/download-artifact@v8
              with:
                  pattern: release-*
                  path: build
                  merge-multiple: true

            - name: Download Wine graphics
              uses: actions/download-artifact@v8
              with:
                  name: wine-graphics
                  path: build/wine

            - name: Package Wine graphics
              env:
                  RELEASE_TAG: ${{ needs.version.outputs.tag }}
              run: |
                  # pyappxportable unpacks these under Wine only; see scripts/build-wined3d.sh.
                  foreach ($architecture in @('x86', 'x64')) {
                    $files = foreach ($name in @('d3d11.dll', 'dxgi.dll', 'wined3d.dll', 'wine-graphics.json')) { "build/wine/wine-$architecture/$name" }
                    foreach ($file in $files) {
                      if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing Wine graphics file: $file" }
                    }
                    Compress-Archive -LiteralPath $files -DestinationPath "build/appx-portable-$env:RELEASE_TAG-wine-$architecture.zip" -CompressionLevel Optimal -Force
                  }

            - name: Download tested Wine CLR runtime
              uses: actions/download-artifact@v8
              with:
                  name: wine-clr
                  path: build/wine-clr

            - name: Publish release
              env:
                  RELEASE_TAG: ${{ needs.version.outputs.tag }}
              run: |
                  $archives = foreach ($architecture in @('x86', 'x64')) {
                    "build/appx-portable-$env:RELEASE_TAG-$architecture.zip"
                    "build/appx-portable-$env:RELEASE_TAG-wine-$architecture.zip"
                  }
                  $archives += 'build/appx-portable-winrt-tools.zip'
                  $archives += @(
                    'build/wine-clr/appx-portable-wine-clr-macos.tar.xz'
                    'build/wine-clr/appx-portable-wine-clr-sources.tar.xz'
                  )
                  gh release create $env:RELEASE_TAG @archives --target $env:GITHUB_SHA --title $env:RELEASE_TAG --generate-notes --latest
                  if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release.' }
