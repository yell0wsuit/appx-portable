name: Clean up PR caches

# A pull request's caches can only be restored by that pull request, so they
# are dead weight once it closes. Fork pull requests get a read-only token
# under pull_request, so they are skipped and their caches left to expire.
on:
    pull_request:
        types: [closed]

permissions:
    actions: write

jobs:
    cleanup:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Delete caches
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  REF: refs/pull/${{ github.event.pull_request.number }}/merge
              run: gh cache delete --all --ref "$REF" --succeed-on-no-caches
