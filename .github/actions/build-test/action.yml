name: Build and test
description: Configures, builds and tests one architecture in build/release-<architecture>.

inputs:
    architecture:
        description: x86 or x64.
        required: true
    version:
        description: Version stamped into the DLLs (APPX_PORTABLE_VERSION).
        required: false
        default: ''

runs:
    using: composite
    steps:
        # Caches from main are shared with pull requests; evicting what this job
        # did not use keeps each saved cache to one build's objects.
        - name: Restore compiler cache
          uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
          with:
              key: ${{ inputs.architecture }}
              # The runner's ccache (4.9, from Strawberry Perl) cannot cache the
              # /Yc compile, so the precompiled header is rebuilt every run. The
              # x86 compiler does not rebuild it byte for byte, which made every
              # x86 file that uses it miss. The action's pinned binary (4.13)
              # caches /Yc.
              install: binary
              max-size: 1G
              evict-old-files: job

        # Ninja runs each compile through ccache, which the Visual Studio
        # generator cannot, so the step enters the MSVC environment itself.
        - name: Configure and build
          shell: pwsh
          env:
              ARCHITECTURE: ${{ inputs.architecture }}
              RELEASE_TAG: ${{ inputs.version }}
              # Required for ccache to reuse compiles that use the precompiled header.
              CCACHE_SLOPPINESS: pch_defines,time_macros
          run: |
              $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
              $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or -not $installation) {
                  throw 'No Visual Studio installation with x86/x64 C++ tools was found.'
              }
              Write-Host "Using $($installation.displayName) at $($installation.installationPath)"
              $targetArch = if ($env:ARCHITECTURE -eq 'x86') { 'x86' } else { 'amd64' }
              Import-Module "$($installation.installationPath)/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
              Enter-VsDevShell -VsInstallPath $installation.installationPath -SkipAutomaticLocation -DevCmdArguments "-arch=$targetArch -host_arch=amd64 -no_logo"
              $build = "build/release-$env:ARCHITECTURE"
              cmake -S . -B $build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=cl -DCMAKE_CXX_COMPILER_LAUNCHER=ccache "-DAPPX_PORTABLE_VERSION=$env:RELEASE_TAG"
              if ($LASTEXITCODE -ne 0) { throw "Failed to configure the $env:ARCHITECTURE build." }
              cmake --build $build
              if ($LASTEXITCODE -ne 0) { throw "Failed to build $env:ARCHITECTURE." }

        - name: Run native tests
          # GPU and media playback tests require desktop hardware unavailable on hosted runners.
          shell: pwsh
          env:
              ARCHITECTURE: ${{ inputs.architecture }}
          run: |
              # CLR activation interception currently supports x86 only.
              $testOptions = @()
              if ($env:ARCHITECTURE -eq 'x64') { $testOptions += @('-LE', 'managed-clr') }
              ctest --test-dir "build/release-$env:ARCHITECTURE" --output-on-failure --timeout 60 -E '^(gputest|mediatest)$' @testOptions
              if ($LASTEXITCODE -ne 0) { throw "Native tests failed for $env:ARCHITECTURE." }

        # The script tests do not depend on the architecture; run them once.
        - name: Run script tests
          if: inputs.architecture == 'x86'
          shell: pwsh
          run: python -m unittest discover -s tests/python
